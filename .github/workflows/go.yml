# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"
        cache: true

    - name: Build
      run: go build ./...

    - name: Test
      run: |
        go install ./cmd/muxt
        go test -race -shuffle=on -timeout 20m ./...

  # Guards the generated code in docs/examples against gosec findings.
  # Excluded rules only fire in the hand-written demo code:
  #   G112, G114  demo servers do not set timeouts
  #   G304, G306  htmx-todo persists todos to a local JSON file
  #   G706        demo servers log their listen address
  gosec:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    # cache-dependency-path keys this job's cache on the workflow file rather
    # than go.sum: gosec's modules are not in go.sum, so sharing the build
    # job's key would leave the gosec build uncached on most runs.
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"
        cache: true
        cache-dependency-path: .github/workflows/go.yml

    # gosec is built against this module's golang.org/x/tools. The version
    # gosec pins cannot read the export data the Go toolchain writes now
    # ("export data version 5 is greater than maximum supported version 4"),
    # so every package fails to type check and the scan exits 1 with no
    # findings.
    - name: Install gosec
      run: |
        tools="$(go list -m -f '{{.Version}}' golang.org/x/tools)"
        mkdir "$RUNNER_TEMP/gosec-build"
        cd "$RUNNER_TEMP/gosec-build"
        go mod init gosec-build
        go get "github.com/securego/gosec/v2/cmd/gosec@v2.29.0" "golang.org/x/tools@${tools}"
        go build -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Scan
      run: gosec -exclude=G112,G114,G304,G306,G706 ./docs/examples/...
